[workspace]
resolver = "3"
members = ["crates/uwumail-core", "crates/uwumail-android", "crates/uwumail-ocr", "crates/uwumail-tnef", "crates/uwumail-labels", "apps/desktop/src-tauri", "apps/setup/src-tauri"]

[workspace.package]
version = "0.10.0-beta.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/MinifyX/UwUMail-Client"
rust-version = "1.88"

[workspace.dependencies]
uwumail-core = { path = "crates/uwumail-core" }
uwumail-android = { path = "crates/uwumail-android" }
uwumail-ocr = { path = "crates/uwumail-ocr" }
# Decoder for winmail.dat, copied as it is from UwUMail Server (crates/uwumail-tnef there).
uwumail-tnef = { path = "crates/uwumail-tnef" }
# Labels without a model (rules, detectors, learned senders, classifier), copied as it is from
# UwUMail Server (crates/uwumail-labels there), so device labels decide like the server.
uwumail-labels = { path = "crates/uwumail-labels" }

ammonia = "4"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23"
# iCalendar and JSCalendar (the `jmap` feature converts between them), like the UwUMail server.
calcard = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
# Text in Windows code pages (uwumail-tnef).
encoding_rs = "0.8"
futures = "0.3"
hickory-resolver = "0.26"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-async-persistent", "tokio", "crypto-rust"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1-rustls", "aws-lc-rs"] }
mail-builder = "1"
mail-parser = "0.11"
# The system's text recognition (crates/uwumail-ocr): Vision on macOS and iOS, Windows.Media.Ocr on
# Windows. Same versions as Tauri's, so nothing is built twice.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler"] }
percent-encoding = "2"
quick-xml = { version = "0.42", features = ["serialize"] }
# Tests only: a certificate for the local HTTPS stub servers (crates/uwumail-core/tests/support).
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
getrandom = "0.4"
psl = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "http2", "charset", "socks"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tracing = "0.1"
idna = "1"
memchr = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
windows = { version = "0.61", features = ["Foundation", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
