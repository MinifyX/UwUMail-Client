[workspace]
resolver = "3"
members = ["crates/uwumail-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/MinifyX/UwUMail-Client"
rust-version = "1.88"

[workspace.dependencies]
uwumail-core = { path = "crates/uwumail-core" }

ammonia = "4"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23"
futures = "0.3"
hickory-resolver = "0.26"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-async-persistent", "tokio", "crypto-rust"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
mail-parser = "0.11"
quick-xml = { version = "0.42", features = ["serialize"] }
getrandom = "0.4"
psl = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "http2", "charset"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
