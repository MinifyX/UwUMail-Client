[package]
name = "uwumail-desktop"
description = "UwUMail app for desktop and Android"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "uwumail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tokio.workspace = true
tracing.workspace = true
uwumail-core.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
base64.workspace = true
minisign-verify = "0.2"
semver = "1"
tauri-plugin-updater = "2"

# macOS has its own single-instance check in a private folder (background.rs).
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Android shows dialogs and notifications from Kotlin; desktop and iOS use the plugins.
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"
tauri-plugin-haptics = "2"

[target.'cfg(target_os = "android")'.dependencies]
uwumail-android.workspace = true
