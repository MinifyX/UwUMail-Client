name: Android

# Builds the signed UwUMail APK for phones (arm64). Every build is signed with
# the same key, so a newer APK installs over the one on the phone.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "brand/**", "README.md", "CONTRIBUTING.md", "release-notes/**"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android
      - run: pnpm install --frozen-lockfile

      - name: Version code
        id: version
        run: |
          # major·10⁹ + minor·10⁷ + patch·10⁵ + run number, so every build and every release counts up.
          node -e '
            const v = require("./apps/desktop/src-tauri/tauri.conf.json").version;
            const [maj, min, pat] = v.split("-")[0].split(".").map(Number);
            const code = maj * 1e9 + min * 1e7 + pat * 1e5 + (Number(process.env.GITHUB_RUN_NUMBER) % 1e5);
            console.log(`version=${v}`);
            console.log(`code=${code}`);
          ' >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.UWUMAIL_ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/uwumail-android.p12"

      - name: Build
        env:
          UWUMAIL_ANDROID_KEYSTORE: ${{ runner.temp }}/uwumail-android.p12
          UWUMAIL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.UWUMAIL_ANDROID_KEYSTORE_PASSWORD }}
          UWUMAIL_ANDROID_KEY_ALIAS: uwumail
          UWUMAIL_ANDROID_KEY_PASSWORD: ${{ secrets.UWUMAIL_ANDROID_KEYSTORE_PASSWORD }}
          UWUMAIL_ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          UWUMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.UWUMAIL_MICROSOFT_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_ID: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_SECRET }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          pnpm tauri android build --apk --target aarch64 --ci

      - name: Collect
        run: |
          apk=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          test -n "$apk" || { echo "::error::No APK was built"; exit 1; }
          mkdir -p out
          cp "$apk" "out/UwUMail-${{ steps.version.outputs.version }}-${{ steps.version.outputs.code }}.apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs out/*.apk | grep -i "SHA-256"
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UwUMail-Android-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: out/*.apk

  smoke:
    name: Smoke test (emulator)
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: UwUMail-Android-${{ github.sha }}
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # An x86_64 image translates the arm64 APK, like Chromebooks do.
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android-smoke.sh out/*.apk smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: UwUMail-Android-smoke-${{ github.sha }}
          retention-days: 7
          path: smoke/
