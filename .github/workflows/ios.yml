name: iOS

# Builds UwUMail for the iPhone and starts it in a simulator.
#
# The IPA is unsigned: UwUMail has no Apple developer account, so nothing here
# carries a certificate. A sideloading tool signs it with your own Apple ID on
# the way to the phone — see docs/ios.md.
#
# The Xcode project isn't in the repository; `tauri ios init` writes a fresh one
# on the runner every time, so nothing generated has to be kept in sync by hand.
#
# The iPhone build and the simulator build (with its smoke test) run side by side
# on runners of their own. The release takes the IPA of this workflow's run for
# the commit's push to main (artifact UwUMail-iOS-<sha>), so it runs for every
# push to main.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "brand/**", "README.md", "CONTRIBUTING.md", "release-notes/**"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: App (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: iPhone, build: iphone }
          - { name: simulator, build: simulator }
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.build == 'simulator' && 'aarch64-apple-ios-sim' || 'aarch64-apple-ios' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust
          key: ios-${{ matrix.build }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile

      - name: Version
        id: version
        run: |
          # iOS wants three numbers; the beta suffix lives on in the build number.
          node -e '
            const v = require("./apps/desktop/src-tauri/tauri.conf.json").version;
            console.log(`version=${v}`);
            console.log(`short=${v.split("-")[0]}`);
            console.log(`build=${process.env.GITHUB_RUN_NUMBER}`);
          ' >> "$GITHUB_OUTPUT"

      - name: Xcode versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # The web view's files have to exist before Xcode builds the app around them.
      - run: pnpm --filter @uwumail/desktop exec vite build

      - name: Xcode project
        env:
          SHORT: ${{ steps.version.outputs.short }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          config=$(jq -nc --arg v "$SHORT" --arg b "$BUILD" '{version: $v, bundle: {iOS: {bundleVersion: $b}}}')
          pnpm tauri ios init --ci --skip-targets-install --config "$config"
          find apps/desktop/src-tauri/gen/apple -maxdepth 2 -not -path '*/build/*' | sort

      - name: Build
        env:
          UWUMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.UWUMAIL_MICROSOFT_CLIENT_ID }}
          UWUMAIL_MICROSOFT_BUSINESS_CLIENT_ID: ${{ secrets.UWUMAIL_MICROSOFT_BUSINESS_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_ID: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_SECRET }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          WHAT: ${{ matrix.build }}
        run: bash scripts/ios-build.sh "$BUILD_VERSION" out "$WHAT"

      - name: Smoke test (simulator)
        if: matrix.build == 'simulator'
        run: bash scripts/ios-smoke.sh out/simulator/*.app smoke

      # The .app keeps its executable bit inside the tar; a plain artifact zip wouldn't.
      - name: Pack the simulator app
        if: always() && matrix.build == 'simulator'
        run: tar -czf "out/UwUMail-simulator.tar.gz" -C out simulator && rm -rf out/simulator

      # The release takes the IPA from this artifact (only the IPA is in it).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.build == 'iphone'
        with:
          name: UwUMail-iOS-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: out/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.build == 'simulator'
        with:
          name: UwUMail-iOS-simulator-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: out/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.build == 'simulator'
        with:
          name: UwUMail-iOS-smoke-${{ github.sha }}
          retention-days: 7
          path: smoke/

      # What `tauri ios init` generated, to look at when a build goes sideways.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: UwUMail-iOS-project-${{ matrix.build }}-${{ github.sha }}
          retention-days: 7
          path: |
            apps/desktop/src-tauri/gen/apple
            !apps/desktop/src-tauri/gen/apple/build
            !apps/desktop/src-tauri/gen/apple/Externals
