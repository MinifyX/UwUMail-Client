name: iOS

# Builds UwUMail for the iPhone and starts it in a simulator.
#
# The IPA is unsigned and the build holds no certificate. A sideloading tool
# signs it with your own Apple ID on the way to the phone — see docs/ios.md.
#
# On a tag and when started by hand (Actions → iOS → Run workflow), `testflight`
# then signs that same IPA for the App Store on a fresh runner and uploads it to
# TestFlight — never for review (docs/app-store.md).
#
# The Xcode project isn't in the repository; `tauri ios init` writes a fresh one
# on the runner every time, so nothing generated has to be kept in sync by hand.
#
# The iPhone build and the simulator build (with its smoke test) run side by side
# on runners of their own. The release takes the IPA of this workflow's run for
# the commit's push to main (artifact UwUMail-iOS-<sha>), so it runs for every
# push to main. Pull requests that touch the app only build for the simulator
# and smoke-test it: the iPhone build is the same code for another target.

on:
  push:
    branches: [main]
    # Path filters don't apply to tags: every release tag goes to TestFlight.
    tags: ["v*"]
    paths-ignore: ["**/*.md", "docs/**", "brand/**", "release-notes/**", "LICENSE"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - "scripts/ios-*.sh"
      - "scripts/opaque-png.mjs"
      - "scripts/apple-ci.sh"
      - "scripts/asc.mjs"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: App (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ github.event_name == 'pull_request' && fromJSON('[{"name":"simulator","build":"simulator"}]') || fromJSON('[{"name":"iPhone","build":"iphone"},{"name":"simulator","build":"simulator"}]') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.build == 'simulator' && 'aarch64-apple-ios-sim' || 'aarch64-apple-ios' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust
          key: ios-${{ matrix.build }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile

      - name: Version
        id: version
        run: |
          # iOS wants three numbers; the beta suffix lives on in the build number.
          node -e '
            const v = require("./apps/desktop/src-tauri/tauri.conf.json").version;
            console.log(`version=${v}`);
            console.log(`short=${v.split("-")[0]}`);
            console.log(`build=${process.env.GITHUB_RUN_NUMBER}`);
          ' >> "$GITHUB_OUTPUT"

      - name: Xcode versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # The web view's files have to exist before Xcode builds the app around them.
      - run: pnpm --filter @uwumail/desktop exec vite build

      - name: Xcode project
        env:
          SHORT: ${{ steps.version.outputs.short }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          config=$(jq -nc --arg v "$SHORT" --arg b "$BUILD" '{version: $v, bundle: {iOS: {bundleVersion: $b}}}')
          pnpm tauri ios init --ci --skip-targets-install --config "$config"
          # The app icon (pnpm --filter @uwumail/desktop icons), over the template's.
          cp apps/desktop/src-tauri/icons/ios/*.png apps/desktop/src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/
          # Without an alpha channel: App Store Connect refuses an app icon that has one (ITMS-90717).
          node scripts/opaque-png.mjs apps/desktop/src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/*.png
          find apps/desktop/src-tauri/gen/apple -maxdepth 2 -not -path '*/build/*' | sort

      - name: Build
        env:
          UWUMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.UWUMAIL_MICROSOFT_CLIENT_ID }}
          UWUMAIL_MICROSOFT_BUSINESS_CLIENT_ID: ${{ secrets.UWUMAIL_MICROSOFT_BUSINESS_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_ID: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_SECRET }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          WHAT: ${{ matrix.build }}
        run: bash scripts/ios-build.sh "$BUILD_VERSION" out "$WHAT"

      - name: Smoke test (simulator)
        if: matrix.build == 'simulator'
        run: bash scripts/ios-smoke.sh out/simulator/*.app smoke

      # The .app keeps its executable bit inside the tar; a plain artifact zip wouldn't.
      - name: Pack the simulator app
        if: always() && matrix.build == 'simulator'
        run: tar -czf "out/UwUMail-simulator.tar.gz" -C out simulator && rm -rf out/simulator

      # The release takes the IPA from this artifact (only the IPA is in it).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.build == 'iphone'
        with:
          name: UwUMail-iOS-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: out/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.build == 'simulator'
        with:
          name: UwUMail-iOS-simulator-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: out/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.build == 'simulator'
        with:
          name: UwUMail-iOS-smoke-${{ github.sha }}
          retention-days: 7
          path: smoke/

      # What `tauri ios init` generated, to look at when a build goes sideways.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: UwUMail-iOS-project-${{ matrix.build }}-${{ github.sha }}
          retention-days: 7
          path: |
            apps/desktop/src-tauri/gen/apple
            !apps/desktop/src-tauri/gen/apple/build
            !apps/desktop/src-tauri/gen/apple/Externals

  # The iPhone build of this run, signed for the App Store and uploaded to TestFlight. A runner of
  # its own that builds nothing: the certificate and the App Store Connect key never share a
  # machine with the build scripts. Signing needs no Xcode project, only the app (scripts/ios-sign.sh).
  testflight:
    name: TestFlight (iOS)
    needs: app
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/apple-ci.sh
            scripts/asc.mjs
            scripts/ios-sign.sh
            apps/desktop/src-tauri/apple/PrivacyInfo.xcprivacy
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: UwUMail-iOS-${{ github.sha }}
          path: unsigned

      - name: Certificate and the App Store Connect key
        env:
          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
        run: |
          bash scripts/apple-ci.sh keychain
          bash scripts/apple-ci.sh api-key

      # Made or renewed on the way when Apple invalidated them (scripts/asc.mjs).
      - name: Provisioning profile
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: node scripts/asc.mjs profiles ios "$DISTRIBUTION_CERT" "$RUNNER_TEMP/profiles"

      # The run number and attempt: grows with every run, and a re-run is a new build too.
      - name: Sign
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          ipa=$(ls unsigned/UwUMail-*-unsigned.ipa)
          bash scripts/ios-sign.sh "$ipa" "$RUNNER_TEMP/profiles" "signed/UwUMail-$BUILD_NUMBER.ipa"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: bash scripts/apple-ci.sh upload signed/UwUMail-*.ipa ios

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UwUMail-iOS-appstore-${{ github.sha }}
          retention-days: 14
          path: signed/*.ipa
          if-no-files-found: error

      - name: Remove the keychain and the key
        if: always()
        run: bash scripts/apple-ci.sh cleanup
