name: Desktop setups

# Builds UwUMail for macOS (one universal setup for Apple chip and Intel) and
# Linux (x64 and arm64: .deb, .rpm, portable folder, and on x64 the per-user
# setup AppImage that older installs update through), then tries each on a real
# runner. scripts/desktop-smoke.sh puts the setups through their paces in a
# throwaway home folder: install, start UwUMail, update over the running app,
# refuse an older version, uninstall; the universal Mac setup on both an Apple
# chip and an Intel Mac. scripts/linux-packages-smoke.sh installs the .deb,
# starts UwUMail from it and from the portable folder, and checks the .rpm. The
# Windows on ARM setup goes through the same with scripts/windows-smoke.ps1.
#
# Nothing here is signed for the updater: the release workflow signs what it
# publishes in a job of its own, on a runner that never built anything.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "brand/**", "README.md", "CONTRIBUTING.md", "release-notes/**"]
  workflow_dispatch:
  workflow_call:
    secrets:
      UWUMAIL_MICROSOFT_CLIENT_ID:
        required: false
      UWUMAIL_GOOGLE_CLIENT_ID:
        required: false
      UWUMAIL_GOOGLE_CLIENT_SECRET:
        required: false

concurrency:
  # github.workflow is the caller's name when the release workflow runs this one, so a release
  # started by hand and this workflow started by hand on the same branch don't cancel each other.
  group: desktop-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            id: macos-universal
            os: macos-15
            # Tauri builds both and joins them into one universal app.
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          # The oldest supported Ubuntu, so the packages run on newer systems too. arm64 is built
          # natively on GitHub's ARM runner.
          - name: Linux x64
            id: linux-x64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          - name: Linux arm64
            id: linux-arm64
            os: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 rpm xdg-utils
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: setup-${{ matrix.id }}
      - run: pnpm install --frozen-lockfile
      - id: version
        run: echo "version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Build the setup
        run: node scripts/build-setup.mjs
        env:
          # Tauri's AppImage tools are AppImages themselves; they unpack instead of needing FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
          UWUMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.UWUMAIL_MICROSOFT_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_ID: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_SECRET }}
      - name: What was built
        run: ls -la target/setup

      - name: Smoke test
        if: runner.os == 'macOS'
        run: bash scripts/desktop-smoke.sh target/setup "${{ steps.version.outputs.version }}" smoke

      # The update programs have to stay executable, which a plain artifact zip forgets. Only the
      # files this build makes, by name; the release takes nothing else from it either.
      - name: Pack for the next jobs
        run: |
          names=$(node scripts/release-files.mjs --names "desktop-${{ matrix.id }}")
          cd target/setup
          # One name per line, none with spaces.
          # shellcheck disable=SC2086
          COPYFILE_DISABLE=1 tar -cf "$RUNNER_TEMP/desktop-${{ matrix.id }}.tar" $names
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.id }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/desktop-${{ matrix.id }}.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && runner.os == 'macOS'
        with:
          name: desktop-smoke-${{ matrix.id }}
          retention-days: 7
          if-no-files-found: ignore
          path: smoke/

  linux-smoke:
    name: Smoke test (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x64 }
          - { os: ubuntu-24.04, arch: x64 }
          - { os: ubuntu-22.04-arm, arch: arm64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: A desktop's basics
        run: |
          sudo apt-get update
          # Graphics drivers never come inside an AppImage; every desktop has them.
          sudo apt-get install -y xvfb dbus-x11 desktop-file-utils xdg-utils libegl1 libgl1 libgles2 libgl1-mesa-dri rpm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - run: mkdir setup && tar -xf "$RUNNER_TEMP/desktop-linux-${{ matrix.arch }}.tar" -C setup
      # The per-user setup only exists for x64, for the copies it installed before.
      - name: Setup
        if: matrix.arch == 'x64'
        run: bash scripts/desktop-smoke.sh setup "${{ needs.build.outputs.version }}" smoke/setup
      - name: Packages and portable folder
        run: bash scripts/linux-packages-smoke.sh setup "${{ needs.build.outputs.version }}" smoke/packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: desktop-smoke-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: ignore
          path: smoke/

  # The universal setup was tried on an Apple chip right after the build; this tries it on Intel.
  macos-intel-smoke:
    name: Smoke test (macOS Intel)
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-macos-universal
          path: ${{ runner.temp }}
      - run: mkdir setup && tar -xf "$RUNNER_TEMP/desktop-macos-universal.tar" -C setup
      - run: bash scripts/desktop-smoke.sh setup "${{ needs.build.outputs.version }}" smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: desktop-smoke-macos-intel
          retention-days: 7
          if-no-files-found: ignore
          path: smoke/

  # Windows on ARM, built natively on GitHub's ARM runner. The x64 setup is built and tried by the
  # release workflow, which this one runs for a release as well.
  windows-arm64:
    name: Build and smoke test (Windows on ARM)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: setup-aarch64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - id: version
        shell: bash
        run: echo "version=$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')" >> "$GITHUB_OUTPUT"

      - name: Build the setup
        run: node scripts/build-setup.mjs --target aarch64-pc-windows-msvc
        env:
          UWUMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.UWUMAIL_MICROSOFT_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_ID: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_SECRET }}

      - name: Smoke test
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 "target/release/UwUMail-windows-arm64-setup.exe" "${{ steps.version.outputs.version }}" arm64 smoke

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows-arm64
          retention-days: 14
          if-no-files-found: error
          path: target/release/UwUMail-windows-arm64-setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: desktop-smoke-windows-arm64
          retention-days: 7
          if-no-files-found: ignore
          path: smoke/
