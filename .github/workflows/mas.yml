name: Mac App Store

# UwUMail for the Mac App Store, to TestFlight: a tag starts it beside the
# release (neither waits for the other), and so does Actions → Mac App Store →
# Run workflow. Pull requests that touch what only this build uses build it
# unsigned, so a change that breaks it shows before a tag does.
#
#   build (no signing secret) ── testflight (signs, packages, uploads; tags and by hand)
#
# `build` compiles the universal sandboxed app without the updater and checks it
# (scripts/build-mas.mjs). It reads the Cargo cache the disk image's build saves
# from main (desktop.yml: same job name, same key, same folders), so only
# UwUMail itself builds again. `testflight` runs on a fresh runner that has built
# and installed nothing — the certificates and the App Store Connect key never
# share a machine with a few hundred build scripts. Nothing is submitted for
# review: the build lands in TestFlight, and only there. docs/app-store.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/mas.yml"
      - "scripts/build-mas.mjs"
      - "scripts/apple-ci.sh"
      - "scripts/asc.mjs"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/build.rs"
      - "apps/desktop/src-tauri/tauri.conf.json"
      - "apps/desktop/src-tauri/tauri.mas.conf.json"
      - "apps/desktop/src-tauri/Info.mas.plist"
      - "apps/desktop/src-tauri/macos/**"
      - "apps/desktop/src-tauri/apple/**"
      - "apps/desktop/src-tauri/src/desktop.rs"
      - "apps/desktop/src-tauri/src/background.rs"
      - "apps/desktop/src-tauri/src/macos_system.rs"
      - "apps/desktop/src-tauri/src/updates.rs"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Named `build` like the disk image's job in desktop.yml: rust-cache keys carry the job's name.
  build:
    name: Build (universal)
    runs-on: macos-15
    steps:
      # Every `uses:` is pinned to a commit, with the version in the comment.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # The disk image's cache (desktop.yml, saved from main); this build only reads it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust
          key: setup-macos-universal
          save-if: false
      - run: pnpm install --frozen-lockfile

      - name: Build the store app, unsigned
        env:
          # Compiled in, as in every other build (docs/oauth.md); not signing material.
          UWUMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.UWUMAIL_MICROSOFT_CLIENT_ID }}
          UWUMAIL_MICROSOFT_BUSINESS_CLIENT_ID: ${{ secrets.UWUMAIL_MICROSOFT_BUSINESS_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_ID: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_SECRET }}
        run: node scripts/build-mas.mjs

      # `ditto` keeps what an app bundle is made of — links, modes, extended attributes.
      - name: Pack the app
        run: |
          mkdir -p dist
          ditto -c -k --keepParent target/universal-apple-darwin/release/bundle/macos/UwUMail.app dist/UwUMail-mas.app.zip
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UwUMail-mas-unsigned-${{ github.sha }}
          retention-days: 7
          path: dist/UwUMail-mas.app.zip
          if-no-files-found: error

  testflight:
    name: TestFlight (macOS)
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      # Only the scripts, not the workspace: nothing here installs or builds.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/apple-ci.sh
            scripts/asc.mjs
            scripts/build-mas.mjs
            apps/desktop/src-tauri/tauri.conf.json
            apps/desktop/src-tauri/macos
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: UwUMail-mas-unsigned-${{ github.sha }}
          path: unsigned

      - name: Certificates and the App Store Connect key
        env:
          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          APPLE_INSTALLER_P12: ${{ secrets.APPLE_INSTALLER_P12 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
        run: |
          bash scripts/apple-ci.sh keychain
          bash scripts/apple-ci.sh api-key

      # Made or renewed on the way when Apple invalidated it (scripts/asc.mjs).
      - name: Provisioning profile
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: node scripts/asc.mjs profiles macos "$DISTRIBUTION_CERT" "$RUNNER_TEMP/profiles"

      # The run number and attempt: grows with every run, and a re-run is a new build too.
      - name: Sign and package
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAS_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          ditto -x -k unsigned/UwUMail-mas.app.zip app
          MAS_PROFILES="$RUNNER_TEMP/profiles" node scripts/build-mas.mjs --sign app/UwUMail.app

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: bash scripts/apple-ci.sh upload target/release/UwUMail-*-mas-universal.pkg macos

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UwUMail-mas-${{ github.sha }}
          retention-days: 14
          path: target/release/UwUMail-*-mas-universal.pkg
          if-no-files-found: error

      - name: Remove the keychain and the key
        if: always()
        run: bash scripts/apple-ci.sh cleanup
