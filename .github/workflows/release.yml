name: Release

# Runs for tags like v0.2.0 or v0.2.0-beta.1 on a commit pushed to main. The tag
# must match the version in apps/desktop/src-tauri/tauri.conf.json, and
# release-notes/<version>.json must exist.
#
# Publishes a GitHub release here, every file under a stable name without the
# version (so https://github.com/<repo>/releases/latest/download/<file> always
# works), with
#   - the Windows setup (x64), built and smoke-tested here,
#   - the Windows on ARM setup, the universal macOS setup, and for Linux x64 and
#     arm64 the .deb, the .rpm and the portable folder, built and smoke-tested
#     by the desktop workflow called from here,
#   - the files only the in-app updater downloads (UwUMail-update-…),
#   - the Android APK the Android workflow built, signed and smoke-tested for
#     the same commit,
#   - the unsigned iPhone IPA the iOS workflow built and tried in the simulator,
# then updates the feeds on the `updates` branch that installed apps check,
# and the AUR package uwumail-bin.
#
# Installed apps only take an update whose signature names the versioned file
# they expect (UwUMail-Setup-0.4.0.exe, ...). The signature covers the bytes and
# that name, not the address, so each update file is signed as a copy under its
# versioned name and published under its stable one (scripts/release-feeds.mjs).
#
# The update-signing key never reaches a runner that built anything: the builds
# run thousands of third-party build scripts, and one of them could leave
# something behind that waits for the key. A separate job on a fresh runner
# signs what the updater downloads, and publishing checks every signature
# against the key the apps carry.
#
# Started by hand on a branch it builds the setups but publishes nothing (the
# APK and IPA are only picked up for a tag). If GitHub can't run it,
# `pnpm release` (scripts/release.mjs) publishes the Windows x64 setup from a PC.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check version and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: meta
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Unexpected version '$version'"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version"
            exit 1
          fi
          jq -e '(.de | type == "string") and (.en | type == "string")' "release-notes/$version.json" > /dev/null \
            || { echo "::error::release-notes/$version.json is missing or lacks de/en"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Release (Windows)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:setup
        env:
          UWUMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.UWUMAIL_MICROSOFT_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_ID: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_SECRET }}
      # The same install, start, update, refuse-older and uninstall as for the other systems.
      - name: Smoke test
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 "target/release/UwUMail-windows-x64-setup.exe" "${{ needs.check.outputs.version }}" x64 smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          if-no-files-found: error
          path: target/release/UwUMail-windows-x64-setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-windows-x64
          retention-days: 7
          if-no-files-found: ignore
          path: smoke/

  desktop:
    name: Release (macOS, Linux, Windows on ARM)
    needs: check
    uses: ./.github/workflows/desktop.yml
    secrets:
      UWUMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.UWUMAIL_MICROSOFT_CLIENT_ID }}
      UWUMAIL_GOOGLE_CLIENT_ID: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_ID }}
      UWUMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_SECRET }}

  sign:
    name: Sign for the updater
    needs: [check, windows, desktop]
    # Only releases are signed, so no signed test build of an unreleased commit lies around.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          # Nothing from a cache that other runs wrote.
          package-manager-cache: false
      # Only for the Tauri CLI, pinned by the lockfile. No install script runs on this runner.
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @uwumail/desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-windows
          path: files
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-windows-arm64
          path: files
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-macos-*
          path: ${{ runner.temp }}/desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-linux-*
          path: ${{ runner.temp }}/desktop
      - name: Unpack the macOS and Linux files
        run: |
          for tar in "$RUNNER_TEMP"/desktop/*/*.tar; do tar -xf "$tar" -C files; done
          ls -la files
      # Each update file as a copy under the versioned name installed apps expect in the signature
      # (the universal Mac program twice, once per name), which leaves <versioned name>.sig behind.
      - name: Sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir signing
          node scripts/release-feeds.mjs --names "$VERSION" > "$RUNNER_TEMP/names.txt"
          while read -r platform asset versioned; do
            echo "▸ $asset for $platform, signed as $versioned"
            cp "files/$asset" "signing/$versioned"
            pnpm --filter @uwumail/desktop exec tauri signer sign "$GITHUB_WORKSPACE/signing/$versioned"
            mv "signing/$versioned.sig" files/
            rm "signing/$versioned"
          done < "$RUNNER_TEMP/names.txt"
      # The same check the feeds get: the key the apps carry, and each signature names its file.
      - name: Check the signatures
        run: node scripts/release-feeds.mjs "$VERSION" "$RUNNER_TEMP/check-feeds" --desktop files
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-signatures
          if-no-files-found: error
          path: files/*.sig

  ios:
    name: Release (iOS)
    needs: check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      # Like the APK: the iOS workflow builds and tries every push to main in the simulator; the
      # release takes that unsigned IPA. Sideloading tools sign it with the user's own Apple ID.
      - name: Wait for the tested IPA of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs | sort_by(.created_at) | last // {} | "\(.id) \(.status) \(.conclusion)"')
            read -r id status conclusion <<< "$run"
            if [ "$id" = "null" ]; then
              if [ "$attempt" -ge 20 ]; then
                echo "::error::No iOS build for $GITHUB_SHA. Push the release commit to main before tagging it."
                exit 1
              fi
            elif [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "::error::The iOS build for this commit ended with '$conclusion': $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
                exit 1
              fi
              gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "UwUMail-iOS-$GITHUB_SHA" --dir ios
              exit 0
            fi
            sleep 30
          done
          echo "::error::The iOS build for this commit didn't finish within an hour"
          exit 1
      - name: Give the IPA its release name
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          shopt -s nullglob
          ipas=(ios/UwUMail-"$VERSION"-*-unsigned.ipa)
          [ "${#ipas[@]}" = 1 ] || { echo "::error::Expected one IPA for $VERSION, found: $(ls ios)"; exit 1; }
          mkdir ipa
          mv "${ipas[0]}" "ipa/UwUMail-ios.ipa"
          unzip -l "ipa/UwUMail-ios.ipa" | grep -q 'Payload/.*\.app/Info.plist' \
            || { echo "::error::The IPA holds no app"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-ios
          if-no-files-found: error
          path: ipa/*.ipa

  android:
    name: Release (Android)
    needs: check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      # The Android workflow builds, signs and smoke-tests every push to main. A release takes that
      # APK instead of building another one, whose version code would count from a different run.
      - name: Wait for the tested APK of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs | sort_by(.created_at) | last // {} | "\(.id) \(.status) \(.conclusion)"')
            read -r id status conclusion <<< "$run"
            if [ "$id" = "null" ]; then
              if [ "$attempt" -ge 20 ]; then
                echo "::error::No Android build for $GITHUB_SHA. Push the release commit to main before tagging it."
                exit 1
              fi
            elif [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "::error::The Android build for this commit ended with '$conclusion': $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
                exit 1
              fi
              gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "UwUMail-Android-$GITHUB_SHA" --dir apk
              exit 0
            fi
            sleep 30
          done
          echo "::error::The Android build for this commit didn't finish within an hour"
          exit 1
      - name: Check the APK
        env:
          VERSION: ${{ needs.check.outputs.version }}
          # The certificate every UwUMail APK is signed with, as in android.yml.
          CERTIFICATE_SHA256: de1cd496582140c9004e05ff087656cdb0b0f575a98dc664e809b5f9b510e301
        run: |
          shopt -s nullglob
          apks=(apk/UwUMail-"$VERSION"-*.apk)
          [ "${#apks[@]}" = 1 ] || { echo "::error::Expected one APK for $VERSION, found: $(ls apk)"; exit 1; }
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$tools/apksigner" verify --print-certs "${apks[0]}" > certs.txt
          grep -qi "certificate SHA-256 digest: $CERTIFICATE_SHA256" certs.txt \
            || { echo "::error::The APK isn't signed with UwUMail's certificate"; exit 1; }
          # The release name; the app checks the download by the SHA-256 in its feed.
          mkdir release
          mv "${apks[0]}" release/UwUMail-android.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-android
          if-no-files-found: error
          path: release/UwUMail-android.apk

  publish:
    name: Publish
    needs: [check, windows, desktop, sign, android, ios]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          # Only runs scripts/release-feeds.mjs. Without this, setup-node v5 sees packageManager in
          # package.json and wants pnpm for its cache, which this job doesn't install.
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: files
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-windows-arm64
          path: files
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-macos-*
          path: ${{ runner.temp }}/desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-linux-*
          path: ${{ runner.temp }}/desktop
      - name: Unpack the macOS and Linux files
        run: |
          for tar in "$RUNNER_TEMP"/desktop/*/*.tar; do tar -xf "$tar" -C files; done
          ls -la files

      # Checks every updater signature against the key the apps carry, before anything is published.
      - name: Write the update feeds
        run: node scripts/release-feeds.mjs "$VERSION" "$RUNNER_TEMP/new-feeds" --desktop files --apk files/UwUMail-android.apk
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            UwUMail-windows-x64-setup.exe
            UwUMail-windows-arm64-setup.exe
            UwUMail-macos-universal.dmg
            UwUMail-linux-x64.deb
            UwUMail-linux-arm64.deb
            UwUMail-linux-x64.rpm
            UwUMail-linux-arm64.rpm
            UwUMail-linux-x64-portable.tar.gz
            UwUMail-linux-arm64-portable.tar.gz
            UwUMail-android.apk
            UwUMail-ios.ipa
            # For the in-app updater only.
            UwUMail-update-macos-universal
            UwUMail-update-linux-x64.AppImage
          )
          # Checksums for everyone who downloads a file by hand.
          (cd files && sha256sum "${files[@]}" > SHA256SUMS.txt)
          cat files/SHA256SUMS.txt
          jq -r '"## Deutsch\n\n" + .de + "\n\n## English\n\n" + .en' "release-notes/$VERSION.json" > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<'EOF'

          ## Downloads

          | | |
          | --- | --- |
          | Windows (x64) | `UwUMail-windows-x64-setup.exe` |
          | Windows on ARM | `UwUMail-windows-arm64-setup.exe` |
          | macOS (Intel & Apple chip) | `UwUMail-macos-universal.dmg` |
          | Ubuntu / Debian | `UwUMail-linux-x64.deb` · ARM: `UwUMail-linux-arm64.deb` |
          | Fedora / openSUSE | `UwUMail-linux-x64.rpm` · ARM: `UwUMail-linux-arm64.rpm` |
          | Arch Linux | @ARCH_ROW@ |
          | Linux portable | `UwUMail-linux-x64-portable.tar.gz` · ARM: `UwUMail-linux-arm64-portable.tar.gz` |
          | Android | `UwUMail-android.apk` |
          | iPhone | `UwUMail-ios.ipa` (sideload with AltStore or Sideloadly, own Apple ID; push notifications limited) |

          **macOS:** UwUMail has no Apple developer ID, so macOS blocks the setup the first time.
          Open it once, then *System Settings → Privacy & Security → Open Anyway*. /
          UwUMail hat keine Apple-Entwickler-ID, macOS blockiert das Setup beim ersten Start. Einmal öffnen,
          dann *Systemeinstellungen → Datenschutz & Sicherheit → Trotzdem öffnen*.

          **iPhone:** the IPA is unsigned and only installs through a sideloading tool such as Sideloadly
          or AltStore, which signs it with your own Apple ID. / Die IPA ist unsigniert und lässt sich nur
          per Sideloading (Sideloadly, AltStore) mit der eigenen Apple-ID installieren.

          **Linux:** the .deb and .rpm update themselves (asking for the administrator password), the portable
          folder doesn't. / Die .deb und .rpm aktualisieren sich selbst (mit Administrator-Passwort), der
          portable Ordner nicht.

          The `UwUMail-update-…` files are for the updater inside UwUMail; you don't need them. /
          Die `UwUMail-update-…`-Dateien holt sich UwUMail für seine Updates, du brauchst sie nicht.

          `SHA256SUMS.txt` lists the checksum of every file. / `SHA256SUMS.txt` enthält die Prüfsumme jeder Datei.
          EOF
          # The AUR package only once it exists there; AUR registration can be closed for a while.
          if curl -fsSg --max-time 15 'https://aur.archlinux.org/rpc/v5/info?arg[]=uwumail-bin' | jq -e '.resultcount > 0' > /dev/null; then
            arch_row='AUR: `yay -S uwumail-bin`'
          else
            arch_row='`UwUMail-linux-x64-portable.tar.gz` (AUR: `uwumail-bin` coming / folgt)'
          fi
          sed -i "s|@ARCH_ROW@|$arch_row|" "$RUNNER_TEMP/notes.md"
          flags=(--latest)
          case "$VERSION" in *-*) flags=(--prerelease) ;; esac
          gh release create "v$VERSION" "${files[@]/#/files/}" files/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "UwUMail $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: updates
          path: feeds
      - name: Publish the update feeds
        working-directory: feeds
        run: |
          cp "$RUNNER_TEMP"/new-feeds/*.json .
          git config user.name "UwUMail Release"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- *.json
          git commit -m "UwUMail $VERSION"
          git push origin HEAD:updates

  aur:
    name: AUR package
    needs: [check, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Only reads the public release; the AUR key is the one secret it gets.
    permissions: {}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Update uwumail-bin
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          # aur.archlinux.org's host key, as the AUR's home page lists its fingerprint
          # (SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4).
          AUR_HOST_KEY: aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::No AUR_SSH_PRIVATE_KEY secret, so uwumail-bin isn't updated. Once the AUR account and its key exist, add the key as that secret."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          printf '%s\n' "$AUR_HOST_KEY" > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone ssh://aur@aur.archlinux.org/uwumail-bin.git "$RUNNER_TEMP/aur"
          node scripts/aur.mjs "$VERSION" "$RUNNER_TEMP/aur"
          cd "$RUNNER_TEMP/aur"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "uwumail-bin is already at $VERSION"
            exit 0
          fi
          git -c user.name="UwUMail Release" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "UwUMail $VERSION"
          git push origin HEAD:master
