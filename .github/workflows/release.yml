name: Release

# Runs for tags like v0.2.0 or v0.2.0-beta.1 on a commit pushed to main. The tag
# must match the version in apps/desktop/src-tauri/tauri.conf.json, and
# release-notes/<version>.json must exist.
#
# Publishes a GitHub release here with the signed Windows setup and the Android
# APK the Android workflow built, signed and smoke-tested for the same commit,
# then updates the feeds on the `updates` branch that installed apps check.
# macOS and Linux packages are only workflow artifacts.
#
# Started by hand on a branch it builds everything but publishes nothing.
# If GitHub can't run it, `pnpm release` (scripts/release.mjs) publishes the
# Windows setup from a PC.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check version and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: meta
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Unexpected version '$version'"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version"
            exit 1
          fi
          jq -e '(.de | type == "string") and (.en | type == "string")' "release-notes/$version.json" > /dev/null \
            || { echo "::error::release-notes/$version.json is missing or lacks de/en"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Release (Windows)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:setup
        env:
          # Only releases are signed, so no signed test build of an unreleased commit lies around.
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          UWUMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.UWUMAIL_MICROSOFT_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_ID: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            target/release/UwUMail-Setup-${{ needs.check.outputs.version }}.exe
            target/release/UwUMail-Setup-${{ needs.check.outputs.version }}.exe.sig

  android:
    name: Release (Android)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      # The Android workflow builds, signs and smoke-tests every push to main. A release takes that
      # APK instead of building another one, whose version code would count from a different run.
      - name: Wait for the tested APK of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs | sort_by(.created_at) | last // {} | "\(.id) \(.status) \(.conclusion)"')
            read -r id status conclusion <<< "$run"
            if [ "$id" = "null" ]; then
              if [ "$attempt" -ge 20 ]; then
                echo "::error::No Android build for $GITHUB_SHA. Push the release commit to main before tagging it."
                exit 1
              fi
            elif [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "::error::The Android build for this commit ended with '$conclusion': $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
                exit 1
              fi
              gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "UwUMail-Android-$GITHUB_SHA" --dir apk
              exit 0
            fi
            sleep 30
          done
          echo "::error::The Android build for this commit didn't finish within an hour"
          exit 1
      - name: Check the APK
        env:
          VERSION: ${{ needs.check.outputs.version }}
          # The certificate every UwUMail APK is signed with, as in android.yml.
          CERTIFICATE_SHA256: de1cd496582140c9004e05ff087656cdb0b0f575a98dc664e809b5f9b510e301
        run: |
          shopt -s nullglob
          apks=(apk/UwUMail-"$VERSION"-*.apk)
          [ "${#apks[@]}" = 1 ] || { echo "::error::Expected one APK for $VERSION, found: $(ls apk)"; exit 1; }
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$tools/apksigner" verify --print-certs "${apks[0]}" > certs.txt
          grep -qi "certificate SHA-256 digest: $CERTIFICATE_SHA256" certs.txt \
            || { echo "::error::The APK isn't signed with UwUMail's certificate"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-android
          if-no-files-found: error
          path: apk/*.apk

  publish:
    name: Publish
    needs: [check, windows, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          # Only runs scripts/release-feeds.mjs. Without this, setup-node v5 sees packageManager in
          # package.json and wants pnpm for its cache, which this job doesn't install.
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: files

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f "files/UwUMail-Setup-$VERSION.exe.sig" || { echo "::error::The setup isn't signed"; exit 1; }
          jq -r '"## Deutsch\n\n" + .de + "\n\n## English\n\n" + .en' "release-notes/$VERSION.json" > "$RUNNER_TEMP/notes.md"
          flags=(--latest)
          case "$VERSION" in *-*) flags=(--prerelease) ;; esac
          gh release create "v$VERSION" "files/UwUMail-Setup-$VERSION.exe" files/UwUMail-"$VERSION"-*.apk \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "UwUMail $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"

      - name: Write the update feeds
        run: |
          apks=(files/UwUMail-"$VERSION"-*.apk)
          node scripts/release-feeds.mjs "$VERSION" "$RUNNER_TEMP/new-feeds" \
            --setup "files/UwUMail-Setup-$VERSION.exe" --apk "${apks[0]}"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: updates
          path: feeds
      - name: Publish the update feeds
        working-directory: feeds
        run: |
          cp "$RUNNER_TEMP"/new-feeds/*.json .
          git config user.name "UwUMail Release"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- *.json
          git commit -m "UwUMail $VERSION"
          git push origin HEAD:updates

      # 0.2.0-beta.2 and older still ask the old MinifyX/UwUMail-Releases repo for updates. Once
      # everyone is past that, archive the repo and remove this step and RELEASES_DEPLOY_KEY.
      - name: Update the old feeds in UwUMail-Releases
        env:
          DEPLOY_KEY: ${{ secrets.RELEASES_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/releases-key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          export GIT_SSH_COMMAND="ssh -i '$key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --depth 1 git@github.com:MinifyX/UwUMail-Releases.git "$RUNNER_TEMP/old"
          cp "$RUNNER_TEMP"/new-feeds/*.json "$RUNNER_TEMP/old/"
          cd "$RUNNER_TEMP/old"
          git add -- *.json
          git -c user.name="UwUMail Release" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -qm "UwUMail $VERSION (now released in MinifyX/UwUMail-Client)"
          git push -q origin main

  other:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      # Not part of the release yet: untested, unsigned, no auto-update.
      - run: pnpm tauri build ${{ matrix.args }}
        env:
          UWUMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.UWUMAIL_MICROSOFT_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_ID: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UwUMail-${{ matrix.name }}-${{ needs.check.outputs.version }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
