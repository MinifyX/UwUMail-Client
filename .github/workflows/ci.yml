name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: UI and SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # The release scripts' own tests (scripts/*.test.mjs).
      - run: node --test "scripts/*.test.mjs"
      - run: pnpm --filter @uwumail/desktop exec vite build
      - run: pnpm --filter @uwumail/setup exec vite build

  engine:
    name: Mail engine
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.8
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
        ports:
          - 3025:3025
          - 3143:3143
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # tauri::generate_context! needs a frontend build to exist at compile time.
      - run: |
          for app in desktop setup; do
            mkdir -p apps/$app/dist && echo '<!doctype html>' > apps/$app/dist/index.html
          done
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: JMAP test server (Stalwart)
        run: bash dev/stalwart.sh
      - run: cargo test --workspace
        env:
          UWUMAIL_TEST_MAILSERVER: 127.0.0.1
          UWUMAIL_TEST_JMAP: http://127.0.0.1:8080

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Known vulnerabilities fail the job; "unmaintained" notices only show up in the log.
      - run: cargo audit --version || cargo install cargo-audit --locked
      - run: cargo audit
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: pnpm audit --prod

  installers:
    name: Installers (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    needs: [ui, engine]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
      - name: Skip for documentation-only changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only HEAD^ HEAD | grep -qvE '^(docs/|brand/|README|CONTRIBUTING|\.github/ISSUE)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.changes.outputs.build == 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.changes.outputs.build == 'true'
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: steps.changes.outputs.build == 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.changes.outputs.build == 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.build == 'true'
      # macOS and Linux setups are built and tested by the desktop workflow.
      - run: pnpm build:setup
        if: steps.changes.outputs.build == 'true' && runner.os == 'Windows'
        env:
          UWUMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.UWUMAIL_MICROSOFT_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_ID: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.changes.outputs.build == 'true'
        with:
          name: UwUMail-${{ matrix.name }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            target/release/UwUMail-windows-*-setup.exe
