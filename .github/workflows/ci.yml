name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: UI and SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @uwumail/desktop exec vite build
      - run: pnpm --filter @uwumail/setup exec vite build

  engine:
    name: Mail engine
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.8
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
        ports:
          - 3025:3025
          - 3143:3143
    steps:
      - uses: actions/checkout@v5
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! needs a frontend build to exist at compile time.
      - run: |
          for app in desktop setup; do
            mkdir -p apps/$app/dist && echo '<!doctype html>' > apps/$app/dist/index.html
          done
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: JMAP test server (Stalwart)
        run: bash dev/stalwart.sh
      - run: cargo test --workspace
        env:
          UWUMAIL_TEST_MAILSERVER: 127.0.0.1
          UWUMAIL_TEST_JMAP: http://127.0.0.1:8080

  installers:
    name: Installers (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    needs: [ui, engine]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Skip for documentation-only changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only HEAD^ HEAD | grep -qvE '^(docs/|brand/|README|CONTRIBUTING|\.github/ISSUE)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Linux build dependencies
        if: steps.changes.outputs.build == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.build == 'true'
      - uses: actions/setup-node@v5
        if: steps.changes.outputs.build == 'true'
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.build == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.build == 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.build == 'true'
      # Windows gets UwUMail's own installer; Linux the usual packages.
      - run: pnpm build:setup
        if: steps.changes.outputs.build == 'true' && runner.os == 'Windows'
        env:
          UWUMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.UWUMAIL_MICROSOFT_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_ID: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_SECRET }}
      - run: pnpm tauri build
        if: steps.changes.outputs.build == 'true' && runner.os == 'Linux'
        env:
          UWUMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.UWUMAIL_MICROSOFT_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_ID: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_ID }}
          UWUMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.UWUMAIL_GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.build == 'true'
        with:
          name: UwUMail-${{ matrix.name }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            target/release/UwUMail-Setup-*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
